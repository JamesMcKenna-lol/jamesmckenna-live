<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" preserveAspectRatio="none">
  <defs>
    <linearGradient id="floor-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b026ff" stop-opacity="0"></stop>
      <stop offset="40%" stop-color="#b026ff" stop-opacity="0.35"></stop>
      <stop offset="100%" stop-color="#ff2e9a" stop-opacity="0.75"></stop>
    </linearGradient>
    <linearGradient id="hot-line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2e9a" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#ff2e9a" stop-opacity="1"></stop>
    </linearGradient>
  </defs>
  
  <g stroke="url(#floor-fade)" stroke-width="1.5" fill="none">
    <line x1="400" y1="0" x2="-100" y2="400"></line>
    <line x1="400" y1="0" x2="0" y2="400"></line>
    <line x1="400" y1="0" x2="100" y2="400"></line>
    <line x1="400" y1="0" x2="200" y2="400"></line>
    <line x1="400" y1="0" x2="300" y2="400"></line>
    <line x1="400" y1="0" x2="400" y2="400"></line>
    <line x1="400" y1="0" x2="500" y2="400"></line>
    <line x1="400" y1="0" x2="600" y2="400"></line>
    <line x1="400" y1="0" x2="700" y2="400"></line>
    <line x1="400" y1="0" x2="800" y2="400"></line>
    <line x1="400" y1="0" x2="900" y2="400"></line>
  </g>
  
  <g stroke="url(#hot-line)" stroke-width="1.5" fill="none">
    <line x1="0" y1="120" x2="800" y2="120" opacity=".25"></line>
    <line x1="0" y1="160" x2="800" y2="160" opacity=".35"></line>
    <line x1="0" y1="205" x2="800" y2="205" opacity=".5"></line>
    <line x1="0" y1="255" x2="800" y2="255" opacity=".7"></line>
    <line x1="0" y1="310" x2="800" y2="310" opacity=".85"></line>
    <line x1="0" y1="370" x2="800" y2="370" opacity="1"></line>
  </g>
</svg>